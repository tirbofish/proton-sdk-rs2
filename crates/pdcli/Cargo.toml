[package]
name = "pdcli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "A command-line client and desktop filesystem interface for Proton Drive"

[[bin]]
name = "pdcli"
path = "src/main.rs"

[[bin]]
name = "pdcli-gui"
path = "src/bin/pdcli-gui.rs"

[dependencies]
proton-drive-sdk = { version = "0.4", path = "../proton-drive-sdk", features = ["cache-encrypted"] }
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

platform-dirs = "0.3"
keyring.workspace = true
rand.workspace = true
ron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { workspace = true }
libc = "0.2"
chrono = "0.4"
futures.workspace = true
filetime = "0.2"
sha2 = "0.10"
sha1.workspace = true
mime_guess = "2"
globset = "0.4"
image = "0.25"
toml = "0.8"

tray-icon = "0.22"
fuser = { version = "0.17.0", features = ["experimental", "async-trait", "tokio"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.11.5"
libadwaita = { version = "0.9.2", features = ["v1_4"] }
