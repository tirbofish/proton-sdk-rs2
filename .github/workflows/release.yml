name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: pdcli ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            protobuf-compiler \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libfuse3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p pdcli

      - name: Package
        run: |
          cp target/release/pdcli "pdcli-${{ matrix.target }}"
          chmod +x "pdcli-${{ matrix.target }}"
          strip "pdcli-${{ matrix.target }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: pdcli-${{ matrix.target }}
          path: pdcli-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/RELEASE.md
          generate_release_notes: true
          files: dist/pdcli-*
