[package]
name = "pdcli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
publish = false # remember to change this when we solidify things

[[bin]]
name = "pdcli"
path = "src/main.rs"

[dependencies]
proton-drive-sdk = { path = "../proton-drive-sdk" }
proton-sdk-rs2 = { path = "../proton-sdk-rs2" }
tokio = { version = "1.50", features = ["full"] }
tokio-util = "0.7"
fuse3 = { version = "0.9", features = ["tokio-runtime", "unprivileged"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

console = "0.16"
indicatif = "0.18"
dialoguer = "0.12"

platform-dirs = "0.3"
keyring = "3"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
bytes = "1"
futures-util = "0.3"
libc = "0.2"
chrono = "0.4"
filetime = "0.2"
sha2 = "0.10"
mime_guess = "2"
globset = "0.4"
md5 = "0.7"
png = "0.17"
image = "0.25"
lru = "0.14"
