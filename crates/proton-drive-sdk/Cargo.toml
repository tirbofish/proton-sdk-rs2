[package]
name = "proton-drive-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
description = "Interface with the Proton Drive client"

[dependencies]
proton-sdk-rs2.workspace = true
proton-srp.workspace = true

proton-crypto.workspace = true
reqwest.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
proton-rpgp.workspace = true
prost.workspace = true
prost-types.workspace = true
base64.workspace = true
log.workspace = true
bytes.workspace = true
http.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
hex.workspace = true
serde_with.workspace = true
serde_repr.workspace = true
bitflags.workspace = true
reqwest-middleware.workspace = true
rand.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
mime_guess.workspace = true
image = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true

[features]
default = ["cache-sqlite", "thumbnail-generation"]

# SQLite-backed cache repository
cache-sqlite = ["rusqlite"]

# AES-256-GCM encrypted cache repository decorator
cache-encrypted = ["aes-gcm"]

# System keyring storage for secrets
cache-keyring = ["keyring"]

# Thumbnail generation from images
thumbnail-generation = ["image"]
