[package]
name = "pdcli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "A command-line client and desktop filesystem interface for Proton Drive"

[[bin]]
name = "pdcli"
path = "src/main.rs"

[dependencies]
proton-drive-sdk = { version = "0.3", path = "../proton-drive-sdk", features = ["cache-encrypted"] }
proton-sdk-rs2 = { version = "0.3", path = "../proton-sdk-rs2" }
tokio = { version = "1.50", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

console = "0.16"
indicatif = "0.18"
dialoguer = "0.12"

platform-dirs = "0.3"
keyring.workspace = true
rand.workspace = true
ron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
bytes = "1"
futures-util = "0.3"
rusqlite = { workspace = true }
libc = "0.2"
chrono = "0.4"
filetime = "0.2"
sha2 = "0.10"
mime_guess = "2"
globset = "0.4"
md5 = "0.7"
png = "0.17"
image = "0.25"
lru = "0.14"
toml = "0.8"

eframe = "0.34"
egui = "0.34"
tray-icon = "0.22"
poll-promise = { version = "0.3.0", features = ["tokio"] }
fuser = { version = "0.17.0", features = ["experimental", "async-trait", "tokio"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
